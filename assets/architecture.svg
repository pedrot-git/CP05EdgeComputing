  <path class="control" d="M656 210 C656 318 650 318 590 318 C528 318 538 356 538 356"/>
  <path class="control" d="M530 664 H272 C274 934 272 1074 360 1104"/>
  <path class="control" d="M642 360 C642 522 650 620 568 620"/>

  <!-- Legend -->
  <path class="ngsi" d="M1048 830 H1130"/>
  <text x="1140" y="838" class="small">NGSIv2</text>
  <path class="mqtt" d="M1048 884 H1130"/>
  <text x="1140" y="892" class="small">MQTT</text>
  <path class="mongo" d="M1048 938 H1130"/>
